name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Vite 8 and @capacitor/cli 8 require Node >= 22.12.
    # Node 20 caused the dependency install to fail in ~28s.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web
      run: npm run build
      env:
        VITE_API_URL: https://tax-web-api.onrender.com

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Must match compileSdkVersion / targetSdkVersion in android/variables.gradle (36).
    - name: Install Android SDK Components
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Capacitor Sync
      run: npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14
